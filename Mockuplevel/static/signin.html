<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Mockuplevel</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Auth styles -->
  <link rel="stylesheet" href="/static/css/auth.css">
</head>

<body class="auth-body min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

  <main class="w-full max-w-md">

    <!-- Brand -->
    <a href="/" class="flex items-center justify-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </div>
      <span class="text-xl font-extrabold tracking-tight text-white">Mockuplevel</span>
    </a>

    <!-- Card -->
    <section class="glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl">
      <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      <p class="text-sm text-slate-400 mt-1 mb-6">Sign in to access your personal dashboard & study analytics.</p>

      <!-- Google Sign In Button -->
      <button type="button" id="google-signin-btn" class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700/80 border border-white/10 text-white font-semibold text-sm transition-all mb-5 shadow-sm group">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google Gmail</span>
      </button>

      <div class="relative flex py-2 items-center mb-5">
        <div class="flex-grow border-t border-white/10"></div>
        <span class="flex-shrink mx-4 text-xs uppercase text-slate-500 font-semibold tracking-wider">or with email</span>
        <div class="flex-grow border-t border-white/10"></div>
      </div>

      <form id="auth-form" data-redirect="/" class="space-y-4">

        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
                 placeholder="nikhil@gmail.com" class="glass-input">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
            <a href="#" class="text-xs font-medium text-indigo-400 hover:text-indigo-300">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   placeholder="Enter your password" class="glass-input has-icon-right">
            <button type="button" class="field-icon-btn" data-toggle-password="password" aria-label="Show password">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer select-none">
          <input type="checkbox" name="remember" checked class="w-4 h-4 rounded accent-indigo-500">
          Keep me signed in
        </label>

        <button type="submit" class="btn-primary" data-loading="Signing in...">
          <span class="btn-label">Sign in</span>
        </button>
      </form>
    </section>

    <p class="text-center text-sm text-slate-400 mt-6">
      New to Mockuplevel?
      <a href="/static/signup.html" class="font-semibold text-indigo-400 hover:text-indigo-300">Create an account</a>
    </p>

  </main>

  <script src="/static/js/session.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.getElementById('google-signin-btn').addEventListener('click', function() {
      var user = window.Session.signInWithGoogle();
      if (user) {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
